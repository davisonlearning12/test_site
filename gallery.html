<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallery – This is a test site.</title><style>body{margin:0;font:18px/1.65 Georgia,serif;color:#1a1a1a;background:#fff}nav{padding:14px 28px;border-bottom:1px solid #e3e3e3;font:600 15px system-ui,sans-serif;display:flex;gap:18px;flex-wrap:wrap}nav a{color:#1a1a1a;text-decoration:none}nav a:hover{color:#1f4fd8}nav span{font-weight:800;margin-right:10px}.hero h1{font:800 clamp(2rem,6vw,3.4rem)/1.1 system-ui,sans-serif;margin:.2em 0}.hero p{font-size:1.25rem;color:#555;margin:0}img{max-width:100%;height:auto;border-radius:6px}.btn{display:inline-block;background:#1f4fd8;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font:600 16px system-ui,sans-serif}main>*{max-width:760px;margin-left:auto;margin-right:auto;padding:0 20px}main{padding:28px 0}.cols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:28px;align-items:start}.cols>*{min-width:0}@media(max-width:640px){.cols{grid-template-columns:1fr}}h2{font:700 1.6rem/1.2 system-ui,sans-serif;margin:.3em 0}.gal{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}.gi{display:block;position:relative;aspect-ratio:var(--r);overflow:hidden;border-radius:6px}.gi img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}@media(max-width:640px){.gal{grid-template-columns:repeat(min(var(--n),3),1fr)}}#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#lb[hidden]{display:none}#lb img{max-width:94vw;max-height:94vh;border-radius:4px}</style></head><body><nav><span>This is a test site.</span><a href="index.html">Home</a><a href="instructions.html">Instructions</a><a href="images.html">Images</a><a href="custom-html.html">Custom Html</a><a href="two-columns.html">Two Columns</a><a href="three-columns.html">Three Columns</a><a href="gallery.html">Gallery</a></nav><main><h2 data-f="text">A gallery of images</h2>
<div class="gal" style="--n:4;--r:4/3"><a class="gi" href="assets/1793085006099-0-fig_roll_1.png"><img src="assets/1793085006099-0-fig_roll_1.png" alt="fig roll 1" loading="lazy"></a><a class="gi" href="assets/1793085006102-1-bourbon_1.png"><img src="assets/1793085006102-1-bourbon_1.png" alt="bourbon 1" loading="lazy"></a><a class="gi" href="assets/1793085006106-2-nice_1.png"><img src="assets/1793085006106-2-nice_1.png" alt="nice 1" loading="lazy"></a><a class="gi" href="assets/1793085006109-3-rich_tea_1.png"><img src="assets/1793085006109-3-rich_tea_1.png" alt="rich tea 1" loading="lazy"></a></div></main><div id="lb" hidden><img alt=""></div><script>(function(){var l=document.getElementById("lb"),im=l.firstChild,all=[].slice.call(document.querySelectorAll("a.gi")),i=0;function show(n){i=(n+all.length)%all.length;im.src=all[i].href;l.hidden=false}document.addEventListener("click",function(e){var a=e.target.closest("a.gi");if(a){e.preventDefault();show(all.indexOf(a))}else if(l.contains(e.target)){l.hidden=true}});document.addEventListener("keydown",function(e){if(l.hidden)return;if(e.key==="Escape")l.hidden=true;if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)})})();</script></body></html>
